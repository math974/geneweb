[tool:pytest]
# Configuration pytest pour les tests GWU

# Répertoires de tests
testpaths = tests

# Patterns de fichiers de test
python_files = test_*.py *_test.py

# Patterns de classes de test
python_classes = Test*

# Patterns de fonctions de test
python_functions = test_*

# Marqueurs personnalisés
markers =
    unit: Tests unitaires
    functional: Tests fonctionnels
    integration: Tests d'intégration
    golden: Tests Golden Master
    performance: Tests de performance
    slow: Tests lents

# Options par défaut
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

# Filtres d'avertissements
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning

# Configuration des rapports
junit_family = xunit2

# Timeout pour les tests (en secondes)
timeout = 300

# Configuration des tests de performance
# --durations=10 pour afficher les 10 tests les plus lents
# --durations=0 pour afficher tous les tests avec leur durée
