[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geneweb-gwd"
version = "1.0.0"
description = "Serveur GeneWeb en Python avec bases .msgpack"
authors = [{name = "GeneWeb Team", email = "team@geneweb.org"}]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "jinja2>=3.1.0",
    "msgpack>=1.0.7",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "click>=8.1.0",
    "python-multipart>=0.0.6"
]

[project.scripts]
geneweb-gwd = "geneweb_gwd.cli.main:serve"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py38']
