[pytest]
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers personnalisés
markers =
    gwu: Tests gwu (export base)
    gwd: Tests gwd (serveur web)
    record: Tests de création de golden (skip par défaut)
    slow: Tests lents (>5s)
    integration: Tests d'intégration

# Options par défaut
addopts = 
    -v
    --tb=short
    --strict-markers
    -m "not record"

# Découverte
norecursedirs = 
    .git
    .pytest_cache
    __pycache__
    golden
    fixtures
    distribution
    .approval_tests_temp 